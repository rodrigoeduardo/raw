<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="Excalifont, 'Segoe Print', sans-serif">
  <rect width="1240" height="560" fill="#161618"/>
  <text x="620" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f3f5">RAW: bounded issue execution and conditional reconciliation</text>
  <g fill="none" stroke="#adb5bd" stroke-width="3" marker-end="url(#arrow)"><path d="M290 160H370"/><path d="M570 160H660"/><path d="M890 160H960"/><path d="M1060 210V360"/></g>
  <g fill="none" stroke="#b197fc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#purpleArrow)"><path d="M960 420H860"/><path d="M600 420H470V210"/></g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#adb5bd"/></marker><marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b197fc"/></marker></defs>
  <g stroke-width="3">
    <rect x="50" y="110" width="240" height="100" rx="18" fill="#183153" stroke="#4dabf7"/><rect x="370" y="110" width="200" height="100" rx="18" fill="#1c3d5a" stroke="#74c0fc"/><rect x="660" y="110" width="230" height="100" rx="18" fill="#173b25" stroke="#69db7c"/><rect x="960" y="110" width="200" height="100" rx="18" fill="#2f2552" stroke="#b197fc"/><rect x="960" y="370" width="220" height="100" rx="18" fill="#123d44" stroke="#66d9e8"/><rect x="600" y="370" width="260" height="100" rx="18" fill="#45214f" stroke="#da77f2" stroke-dasharray="9 7"/>
  </g>
  <g text-anchor="middle" font-size="19" font-weight="700">
    <text x="170" y="150" fill="#74c0fc">AUTOPILOT / NEXT-TASK<tspan x="170" dy="27" font-weight="400">select + claim</tspan></text><text x="470" y="150" fill="#a5d8ff">AUTO-EXECUTOR<tspan x="470" dy="27" font-weight="400">one issue · 50 turns</tspan></text><text x="775" y="150" fill="#8ce99a">/BUILD-ISSUE<tspan x="775" dy="27" font-weight="400">TDD + CLI evidence</tspan></text><text x="1060" y="150" fill="#d0bfff">PR + REVIEWER<tspan x="1060" dy="27" font-weight="400">independent gate</tspan></text><text x="1070" y="410" fill="#99e9f2">CHEAP BABYSITTER<tspan x="1070" dy="27" font-weight="400">CI · status · fingerprint</tspan></text><text x="730" y="410" fill="#e599f7">STRONG RECONCILER<tspan x="730" dy="27" font-weight="400">conditional batch → FIX</tspan></text>
  </g>
  <text x="910" y="401" text-anchor="middle" font-size="15" fill="#b197fc">findings only</text><text x="620" y="526" text-anchor="middle" font-size="17" fill="#adb5bd">No findings → no reconciler. One issue → one executor invocation. Independent review stays intact.</text>
</svg>
