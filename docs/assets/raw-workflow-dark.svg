<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" width="1440" height="620" font-family="Excalifont, 'Segoe Print', sans-serif">
  <rect width="1440" height="620" fill="#161618"/>
  <text x="720" y="55" text-anchor="middle" font-size="25" font-weight="700" fill="#f1f3f5">RAW: bounded execution, independent review, conditional reconciliation</text>
  <g fill="none" stroke-width="2" stroke-dasharray="8 6">
    <rect x="30" y="95" width="240" height="200" rx="18" fill="#172b3d" stroke="#74c0fc"/>
    <rect x="290" y="95" width="400" height="200" rx="18" fill="#1b3321" stroke="#8ce99a"/>
    <rect x="710" y="95" width="440" height="345" rx="18" fill="#29233d" stroke="#b197fc"/>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="700">
    <text x="150" y="125" fill="#74c0fc">BOARD CONTEXT</text>
    <text x="490" y="125" fill="#8ce99a">ISSUE CONTEXT · ISOLATED WORKER</text>
    <text x="930" y="125" fill="#b197fc">PR CONTEXT · INDEPENDENT LIFECYCLE</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#adb5bd"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b197fc"/></marker>
  </defs>
  <g fill="none" stroke="#adb5bd" stroke-width="3" marker-end="url(#arrow)">
    <path d="M245 195H315"/><path d="M485 195H515"/><path d="M665 195H735"/><path d="M915 195H955"/><path d="M1125 195H1190"/><path d="M1280 245V310"/>
  </g>
  <g fill="none" stroke="#b197fc" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#purpleArrow)">
    <path d="M1040 245V310"/><path d="M800 350H400V255"/>
  </g>
  <g stroke-width="3">
    <rect x="55" y="145" width="190" height="100" rx="18" fill="#24527a" stroke="#74c0fc"/>
    <rect x="315" y="135" width="170" height="120" rx="18" fill="#28733d" stroke="#8ce99a"/>
    <rect x="515" y="135" width="150" height="120" rx="18" fill="#347a42" stroke="#b2f2bb"/>
    <rect x="735" y="145" width="180" height="100" rx="18" fill="#4b3c78" stroke="#b197fc"/>
    <rect x="955" y="145" width="170" height="100" rx="18" fill="#176b78" stroke="#99e9f2"/>
    <rect x="800" y="310" width="260" height="95" rx="18" fill="#743e83" stroke="#e599f7" stroke-dasharray="9 7"/>
    <rect x="1190" y="145" width="180" height="100" rx="18" fill="#875b21" stroke="#ffd8a8"/>
    <rect x="1190" y="310" width="180" height="95" rx="18" fill="#806b1e" stroke="#ffec99"/>
  </g>
  <g text-anchor="middle" font-size="16">
    <text x="150" y="180" fill="#d0ebff" font-weight="700">AUTOPILOT /<tspan x="150" dy="20" font-weight="700">NEXT-TASK</tspan><tspan x="150" dy="20" font-weight="400">select + claim</tspan></text>
    <text x="400" y="170" fill="#e6fcf5" font-weight="700">AUTO-EXECUTOR<tspan x="400" dy="20" font-weight="400">BUILD / FIX</tspan><tspan x="400" dy="20" font-weight="400">Claude or</tspan><tspan x="400" dy="20" font-weight="400">Codex</tspan></text>
    <text x="590" y="170" fill="#ebfbee" font-weight="700">BUILD-ISSUE<tspan x="590" dy="20" font-weight="400">TDD + verify</tspan><tspan x="590" dy="20" font-weight="400">bounded CLI</tspan><tspan x="590" dy="20" font-weight="400">evidence</tspan></text>
    <text x="825" y="180" fill="#e5dbff" font-weight="700">AUTO-REVIEWER<tspan x="825" dy="20" font-weight="400">independent diff</tspan><tspan x="825" dy="20" font-weight="400">+ evidence</tspan></text>
    <text x="1040" y="180" fill="#c5f6fa" font-weight="700">AUTO-BABYSITTER<tspan x="1040" dy="20" font-weight="400">CI + status</tspan><tspan x="1040" dy="20" font-weight="400">fingerprint</tspan></text>
