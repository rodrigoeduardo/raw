    <text x="1280" y="352" fill="#fff3bf" font-weight="700">DEPLOY GATE<tspan x="1280" dy="20" font-weight="400">human or auto</tspan></text>
  </g>
  <text x="1102" y="270" text-anchor="middle" font-size="16" fill="#b197fc">blocking<tspan x="1102" dy="20">findings</tspan></text>
  <text x="663" y="383" text-anchor="middle" font-size="16" fill="#b197fc">confirmed → targeted FIX</text>
  <text x="720" y="570" text-anchor="middle" font-size="16" fill="#adb5bd">solid = normal stage   ·   dashed = conditional path   ·   one issue = one executor invocation   ·   independent review stays intact</text>
