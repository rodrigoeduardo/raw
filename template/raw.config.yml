# raw.config.yml — workflow configuration
# Read by every raw skill at the start of a run. Edit by hand or run /configure.
# Every key has a safe default (shown here); a missing file means "all defaults".

# Human gates. Each is "human" (a person performs/authorizes the step) or "auto"
# (agents may perform it). Defaults are the safe ones: everything human.
gates:
  # Who promotes issues from status:proposed to status:ready (makes them claimable).
  promote: human
  # Who clicks merge on an approved, green PR. "auto" lets /autopilot merge.
  merge: human
  # Who triggers a deploy after merges. Only meaningful if commands.deploy is set.
  deploy: human

# Project commands agents run. Fill these for your stack.
# Unset commands are skipped (agents will note the skip, never guess a command).
commands:
  install: # e.g. npm ci
  lint: # e.g. npm run lint
  test: # e.g. npm test
  test_all: # full suite incl. integration, e.g. npm run test:all
  deploy: # e.g. npm run deploy — leave unset if CD deploys main automatically
  dev: # e.g. npm run dev — run the app locally; required by the evidence gate below

# Git integration branch — the branch workers cut from, PRs target, and the
# merge gate measures "behind" against. Unset ⇒ the repo's git default branch
# (`gh repo view --json defaultBranchRef`). Set this whenever development
# integrates somewhere other than the default branch: here `main` is a stale
# release branch and every migration spec/commit lives on `develop`, so a worker
# cut from the default `main` would build against missing specs. Every skill and
# adapter reads this key in place of "<default-branch>".
git:
  integration_branch: develop

# Domain area labels (area:*) used on issues. Define your own; these are examples.
# /configure can create them on GitHub for you.
labels:
  areas: []
  # EXAMPLE:
  # areas: [setup, database, auth, billing, notifications]

# Where the planner (/plan-board) reads specs from.
specs_dir: docs/specs

# Sub-skill bindings — which skill fulfills each role. Swap freely if you use a
# different TDD/verification skill; raw skills invoke roles, not hardcoded names.
bindings:
  tdd: superpowers:test-driven-development
  verification: superpowers:verification-before-completion

# /autopilot orchestrator tuning.
autopilot:
  # Max executors running concurrently (1 = sequential).
  parallel: 1
  # One automated review→fix round per PR. More unresolved work surfaces to a
  # human instead of recursively amplifying executor/reviewer context and cost.
  max_fix_cycles: 1

# ---------------------------------------------------------------------------
# Pluggability. Every default below is the current shipped behavior — leaving
# this whole block out uses these values. Each provider has an adapter doc under
# docs/workflow/adapters/; skills read the doc for the provider you select.
# ---------------------------------------------------------------------------

# Where the board lives. The *tracker state* is the machine source of truth;
# for GitHub that state is issue labels. PRs are always GitHub either way, so
# ai-review:* labels are unaffected by this choice.
tracker:
  provider: github # github | linear    → adapters/tracker-<provider>.md
  linear: # only read when provider: linear
    team: # e.g. ENG
    states: # Linear workflow state per raw status
      proposed: Backlog
      ready: Todo
      in_progress: In Progress
      in_review: In Review
      blocked: Blocked
    # Who moves the Linear issue to Done on PR merge.
    #   integration — the native Linear↔GitHub integration does it (default
    #                 assumption); the orchestrator only verifies afterward.
    #   manual      — the integration is NOT installed here, so the orchestrator
    #                 transitions the issue itself on merge and skips the probe.
    # This workspace has no active integration (every merge this far left the
    # issue in "In Review" until the orchestrator moved it), so: manual.
    close_on_merge: manual

# How isolated workspaces are created for workers.
worktrees:
  provider: claude # claude | orca | conductor (experimental)
  # Gitignored files a fresh worktree needs but cannot inherit — env files above
  # all, without which commands.dev won't start and the evidence gate below
  # can't be satisfied.
  #
  # Under provider: claude with Claude runners this is already handled by
  # `.worktreeinclude` at the repo root. An explicit Codex runner bypasses that
  # mechanism and uses seed_files. Set this to cover what .worktreeinclude can't:
  #   - a Codex executor under the claude provider;
  #   - the orca and conductor providers, which don't run that code path;
  #   - a path whose absence should BLOCK the worker with a named reason rather
  #     than fail later as an unexplained dev-server crash.
  # Each entry is copied from the primary repo root during the worker's
  # preflight and deleted before it reports. Empty = nothing is copied.
  seed_files: []
  # EXAMPLE:
  # seed_files: [.env.local]

# Which engine runs each role. `bindings` above picks a *skill*; `runners`
# picks an *engine*. Claude models map to the Agent-tool model override (the
# agent frontmatter model stays the fallback).
runners:
  executor: { runner: claude, model: sonnet, effort: medium } # runner: claude | codex
  reviewer: { runner: claude, model: sonnet, effort: medium }
  # Mechanical per-PR lifecycle: CI/status/fingerprints/labels/mergeability.
  babysitter: { runner: claude, model: sonnet, effort: low }
  # Conditional, read-only judgment for a batch of substantive blocking findings.
  # Missing in an older config means this default; no findings means no invocation.
  reconciler: { runner: claude, model: opus, effort: medium }
  # Optional second reviewer from another model family, for decorrelated errors.
  # Its findings are comments only — raw's reviewer still owns the verdict label.
  # e.g. { runner: codex, model: gpt-5.6-codex, effort: medium }
  adversarial_reviewer:
  # Headless invocation template for the codex runner.
  codex_command: codex exec

# Evidence gate: "done" on user-visible work needs an artifact someone other
# than the worker looked at.
evidence:
  # auto     — required whenever the issue is user-visible (template field or a
  #            UI-ish area:* label); inert for repos/issues with no UI surface
  # required — always required
  # off      — never required
  ui_screenshot: auto
  # How the screenshot is captured. playwright (default) follows the bounded
  # `npx playwright` path in docs/workflow/adapters/evidence-playwright.md.
  # manual = the worker improvises (escape hatch for other stacks).
  driver: playwright # playwright | manual
